<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masjid Al-Furqan TV</title><style>
body{margin:0;background:#f8f6ef;color:#18382c;font-family:Arial,sans-serif}.tv{min-height:100vh;display:grid;grid-template-columns:1.2fr .8fr}.left{padding:48px}.right{background:#245f46;color:white;padding:48px;display:flex;flex-direction:column;justify-content:center}.logo{width:110px}.clock{font-size:88px;font-weight:900;margin:26px 0}.title{font-size:52px}.sub{font-size:24px;color:#6f7e77}.next{font-size:34px}.count{font-size:86px;font-weight:900}.times{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:36px}.p{background:white;border:1px solid #ddd9cb;border-radius:18px;padding:18px;text-align:center}.p strong{display:block;font-size:28px}.p span{font-size:18px;color:#6f7e77}@media(max-width:900px){.tv{grid-template-columns:1fr}.right{min-height:35vh}.times{grid-template-columns:repeat(2,1fr)}} 
</style></head><body><div class="tv"><section class="left"><img class="logo" src="assets/logo.png"><div class="title">Masjid Al-Furqan</div><div class="sub">Malir Cantt, Karachi</div><div class="clock" id="clock">--:--:--</div><div class="times" id="times"></div></section><section class="right"><div class="next">Next Jamaat</div><div id="next" class="title">—</div><div id="count" class="count">--:--:--</div><div id="msg" class="next">Please keep your mobile phone on silent inside the masjid.</div></section></div><script src="config.js"></script><script>
const D=window.MASJID_CONFIG.defaults,O=["Fajr","Dhuhr","Asr","Maghrib","Isha"];let T=null;const $=x=>document.getElementById(x),clean=v=>String(v||"").split(" ")[0].slice(0,5),show=h=>{if(!h)return"—";let[a,b]=h.split(":").map(Number),p=a>=12?"PM":"AM";a=a%12||12;return`${a}:${String(b).padStart(2,"0")} ${p}`},m=h=>{let[a,b]=h.split(":").map(Number);return a*60+b};
function now(){let p=new Intl.DateTimeFormat("en-US",{timeZone:D.timezone,hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).formatToParts(new Date()),o={};p.forEach(x=>o[x.type]=x.value);return{h:+o.hour,mi:+o.minute,s:+o.second}}
function tick(){$("clock").textContent=new Intl.DateTimeFormat("en-US",{timeZone:D.timezone,hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true}).format(new Date());if(!T)return;let e={};O.forEach(k=>e[k]=D.jamaatTimes[k]||clean(T[k]));let n=now(),mm=n.h*60+n.mi,k=O.find(x=>m(e[x])>mm),tom=false;if(!k){k="Fajr";tom=true}let[a,b]=e[k].split(":").map(Number),s=a*3600+b*60-(n.h*3600+n.mi*60+n.s)+(tom?86400:0);$("next").textContent=k+(tom?" Tomorrow":"");$("count").textContent=[Math.floor(s/3600),Math.floor((s%3600)/60),s%60].map(x=>String(x).padStart(2,"0")).join(":")}
fetch(`https://api.aladhan.com/v1/timings/${Math.floor(Date.now()/1000)}?latitude=${D.latitude}&longitude=${D.longitude}&method=${D.calculationMethod}&school=${D.school}`).then(r=>r.json()).then(j=>{T=j.data.timings;let el=$("times");O.forEach(k=>{let e=D.jamaatTimes[k]||clean(T[k]),d=document.createElement("div");d.className="p";d.innerHTML=`<strong>${k}</strong><span>${show(e)}</span>`;el.appendChild(d)})});setInterval(tick,1000);tick();
</script></body></html>
